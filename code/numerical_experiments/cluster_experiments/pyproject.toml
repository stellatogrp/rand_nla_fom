[project]
name = "rand-nla-cluster-experiments"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4",
  "osqp>=1.0,<2", "scs>=3.2,<4", "cvxpy>=1.6,<2", "threadpoolctl>=3.5",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
